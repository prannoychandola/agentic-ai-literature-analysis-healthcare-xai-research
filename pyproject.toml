[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-xai-research"
version = "0.1.0"
description = "Reproducible healthcare-XAI literature analysis and candidate research-gap identification."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "requests",
    "numpy",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
